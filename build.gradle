plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.14.10'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:intermediary:${project.minecraft_version}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.register('decodeOrangeBadge') {
    def encodedBadge = file('src/main/resources/assets/orange/orange_badge.png.b64')
    def outputBadge = file('src/main/resources/assets/orange/orange_badge.png')
    def modMenuIcon = file('src/main/resources/assets/orange/icon.png')
    inputs.file(encodedBadge)
    outputs.files(outputBadge, modMenuIcon)
    doLast {
        def encoded = encodedBadge.getText('US-ASCII').replaceAll('\\s', '')
        def pngBytes = java.util.Base64.getDecoder().decode(encoded)
        outputBadge.bytes = pngBytes
        modMenuIcon.bytes = pngBytes
    }
}

processResources {
    dependsOn tasks.named('decodeOrangeBadge')
    filteringCharset = 'UTF-8'
    exclude '**/*.png.b64'
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('decodeOrangeBadge')
}
