name: Build Orange Client

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orange-client-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          # Gradle dependency caching is handled by setup-gradle.

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Verify Gradle Project
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          test -f settings.gradle
          test -f gradle.properties
          test -f src/main/resources/fabric.mod.json
          echo "Gradle project files found."

      - name: Build Orange Client
        run: gradle --no-daemon --stacktrace clean build

      - name: Prepare Mod JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'orange-client-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          if [[ -z "${jar_path}" ]]; then
            echo "No remapped Orange Client JAR was produced."
            find build -maxdepth 3 -type f -name '*.jar' -print || true
            exit 1
          fi
          mkdir -p dist
          cp "${jar_path}" dist/Orange-Client.jar
          sha256sum dist/Orange-Client.jar

      - name: Upload Orange Client JAR
        uses: actions/upload-artifact@v4
        with:
          name: Orange-Client
          path: dist/Orange-Client.jar
          if-no-files-found: error
          retention-days: 14
